<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<!-- Auto-reload every 5 min — tightened from 15min after user complained about staleness -->
<meta http-equiv="refresh" content="300">
<!-- PWA manifest — enables "Add to Home Screen" on iPhone for installed-app behavior
     (much better cache control than Safari tabs) -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>eXpressO News</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600;700&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #c9a67a; color: #1a1a1a; min-height: 100vh; display: flex; flex-direction: column; }
  header { background: #f7f2ea; color: #1c1410; padding: 20px 32px 0; border-bottom: 3px solid #d4b896; }
  .header-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 2px; }
  .logo { font-family: "Playfair Display", Georgia, serif; font-size: 2rem; font-weight: 800; font-style: italic; letter-spacing: -0.5px; }
  .tagline { font-size: 0.65rem; letter-spacing: 2.5px; text-transform: uppercase; color: #8a7e72; margin-bottom: 14px; font-weight: 500; }
  .date { font-size: 0.8rem; color: #6b5d4f; font-weight: 500; }
  .freshness-badge { display: inline-block; margin-left: 12px; padding: 4px 10px; background: #ede8e0; color: #6b5d4f; font-size: 0.7rem; font-weight: 600; border-radius: 12px; cursor: pointer; user-select: none; transition: background 0.15s; vertical-align: middle; border: 1px solid #d4b896; }
  .freshness-badge:hover { background: #e0d8cb; color: #1c1410; }
  .freshness-badge.stale { background: #f4d4b8; color: #8a4a18; border-color: #d49b6e; }
  .freshness-badge.very-stale { background: #f0a070; color: #4a1a08; border-color: #b86040; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.7; } }
  nav { display: flex; gap: 0; margin: 0 -32px; padding: 0 32px; flex-wrap: wrap; border-top: 1px solid rgba(0,0,0,0.08); }
  nav a { color: #8a7e72; text-decoration: none; padding: 9px 11px; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; cursor: pointer; border-bottom: 2px solid transparent; transition: color 0.2s, border-color 0.2s; }
  nav a:hover { color: #3a2a18; }
  nav a.active { color: #b8860b; border-bottom: 2px solid #b8860b; font-weight: 700; }
  main { flex: 1; max-width: 880px; width: 100%; margin: 0 auto; padding: 28px 24px; }
  .section-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1.5px; color: #f0e6d6; margin-bottom: 6px; font-weight: 600; }
  h1 { font-family: "Playfair Display", Georgia, serif; font-size: 1.7rem; font-weight: 800; margin-bottom: 6px; line-height: 1.2; color: #fff8ee; text-shadow: 0 1px 3px rgba(80,40,0,0.3); }
  .subtitle { color: #f0e6d6; font-size: 0.88rem; margin-bottom: 24px; line-height: 1.5; }
  .story { border: 1px solid #d4b896; border-radius: 6px; margin-bottom: 10px; background: #faf6f0; overflow: hidden; box-shadow: 0 2px 8px rgba(80,50,20,0.15); }
  .story-header { padding: 14px 18px; cursor: pointer; display: flex; align-items: flex-start; gap: 10px; font-weight: 600; font-size: 0.9rem; line-height: 1.4; user-select: none; }
  .story-header:hover { background: #f5efe5; }
  .arrow { flex-shrink: 0; transition: transform 0.2s; font-size: 0.65rem; margin-top: 5px; color: #b5a998; }
  .story.open > .story-header > .arrow { transform: rotate(90deg); }
  .story > .story-body { display: none; padding: 0 18px 18px 40px; }
  .story.open > .story-body { display: block; }
  .perspective { margin-bottom: 14px; line-height: 1.6; font-size: 0.88rem; }
  .perspective:last-child { margin-bottom: 0; }
  /* World tab: Red / White / Blue nested perspective blocks — Business-tab style */

  .perspective-block > .story-header { padding: 10px 14px; font-size: 0.85rem; }
  .perspective-block > .story-body { padding: 0 14px 14px 30px; }

  .perspective-conservative > .story-header:hover { background: #f5d8d4; }
  .perspective-independent  { background: #fafafa; border-color: #d8d4cb; }
  .perspective-independent > .story-header:hover { background: #f0ede6; }
  .perspective-democrat     { background: #e6eff7; border-color: #b4cae0; }
  .perspective-democrat > .story-header:hover { background: #d4e2ef; }
  .label-conservative { color: #a63d2f; font-weight: 700; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.5px; }
  .label-democrat { color: #2b6ea3; font-weight: 700; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.5px; }
  .label-thirdparty { color: #5a7247; font-weight: 700; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.5px; }
  .label-elon { color: #c07b2a; font-weight: 700; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.5px; }
  .label-sage { color: #7a4d8e; font-weight: 700; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.5px; }
  .label-pop { color: #b84233; font-weight: 700; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.5px; }
  .handle { font-weight: 600; }
  .perspective-link { text-decoration: none; color: inherit; display: block; border-radius: 4px; transition: background 0.15s; }
  .perspective-link:hover { background: #ede8e0; }
  .perspective-link:hover .handle { text-decoration: underline; }
  .handle a { color: inherit; text-decoration: none; }
  .handle a:hover { text-decoration: underline; }
  .honesty { font-size: 0.82rem; color: #5a4e42; font-weight: 600; margin-left: 6px; background: #ede8e0; padding: 1px 6px; border-radius: 3px; }
  .single-post .post-handle { font-weight: 700; font-size: 0.88rem; margin-bottom: 4px; }
  .single-post .post-handle a { color: #2c1e10; text-decoration: none; }
  .single-post .post-handle a:hover { text-decoration: underline; }
  .view-post { display: inline-block; color: #2980b9; font-size: 0.78rem; text-decoration: none; margin-bottom: 8px; font-weight: 600; }
  .view-post:hover { text-decoration: underline; color: #1a5f8a; }
  .post-stats { font-size: 0.78rem; color: #a89e93; margin-bottom: 8px; }
  .post-body { font-size: 0.88rem; line-height: 1.65; color: #3d3029; }
  .footnote-item { font-size: 0.82rem; line-height: 1.5; color: #2a1810; margin-bottom: 5px; font-weight: 500; }

  .holdings-table td { padding: 8px 6px; border-bottom: 1px solid #eee; font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .holdings-table col.c-tk { width: 62px; }
  .holdings-table col.c-nm { width: auto; }
  .holdings-table col.c-pr { width: 72px; }
  .holdings-table col.c-pct { width: 56px; }
  .holdings-table col.c-hb { width: 130px; }
  .holdings-table th.num, .holdings-table td.num { text-align: right; }
  .holdings-table td.held-by { font-size: 0.7rem; color: #666; }

    .holdings-table { font-size: 0.7rem; }
    .holdings-table th, .holdings-table td { padding: 6px 4px; }
    .holdings-table col.c-tk { width: 50px; }
    .holdings-table col.c-pr { width: 60px; }
    .holdings-table col.c-pct { width: 44px; }
    .holdings-table col.c-hb { width: 90px; }

  .pos { color: #27ae60; font-weight: 600; }
  .neg { color: #c0392b; font-weight: 600; }
  .ticker { font-weight: 700; font-family: monospace; }
  .tab-art { float: right; width: 280px; max-width: 38%; margin: 6px 0 18px 24px; }
  .tab-art-bump { width: 340px; max-width: 44%; }
  .tab-art-big  { width: 400px; max-width: 50%; }
  .tab-art-wide { width: 450px; max-width: 55%; }
  .tab-art img { width: 100%; display: block; border: 1px solid #b89968; box-shadow: 0 4px 18px rgba(0,0,0,0.22); border-radius: 2px; }
  .tab-art-caption { margin-top: 10px; font-family: Georgia, serif; font-size: 1rem; font-style: italic; color: #4a2f1a; text-align: center; letter-spacing: 0.3px; }
  .tab-art-caption.strong { font-size: 1.15rem; font-style: normal; font-weight: 700; color: #2a1810; }
  @media (max-width: 700px) {
    /* Mobile: image becomes a full-width block ABOVE stories so accordions get full width.
       This prevents first-story squeeze AND lets tweet embeds render at full width when tapped. */
    .tab-art {
      float: none;
      clear: both;
      display: block;
      width: 100%;
      max-width: 100%;
      margin: 0 0 20px 0;
    }
    .tab-art-bump, .tab-art-big, .tab-art-wide {
      width: 100%;
      max-width: 100%;

    .tab-art-wide img { max-height: 320px; }

    .tab-art-caption.strong { font-size: 0.9rem; }

  .row-sell { background: #ffebee; }
  .row-sell:hover { background: #ffcdd2 !important; }
  .row-hold { background: #fff; }

  .tag-sell { background: #c0392b; color: #fff; }

  .submit-btn { background:#1c1410; color:#f0ebe3; border:none; padding:12px 28px; border-radius:6px; font-size:0.88rem; font-weight:600; cursor:pointer; font-family:inherit; }

  .myfeed-mic { background:#fff; color:#555; border:2px solid #ccc; border-radius:50%; width:44px; height:44px; font-size:1.1rem; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:all 0.2s; }
  .myfeed-mic:hover { border-color:#888; color:#333; }
  .myfeed-mic.recording { background:#ffe0e0; border-color:#c0392b; color:#c0392b; animation: pulse 1s infinite; }

  .myfeed-go { background:#1c1410; color:#f0ebe3; border:none; padding:12px 24px; border-radius:6px; font-size:0.88rem; font-weight:600; cursor:pointer; font-family:inherit; flex-shrink:0; }

  @media (max-width: 600px) { header { padding: 14px 16px 0; position: relative; } nav { margin: 0 -16px; padding: 0 8px; overflow-x: auto; flex-wrap: nowrap; -webkit-overflow-scrolling: touch; scrollbar-width: none; } nav::-webkit-scrollbar { display: none; } nav a { padding: 8px 8px; font-size: 0.62rem; white-space: nowrap; } main { padding: 20px 16px; } .logo { font-size: 1.5rem; } h1 { font-size: 1.3rem; } header::after { content: "\203A"; position: absolute; right: 4px; bottom: 6px; width: 24px; height: 28px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; font-weight: 700; color: #6b4a2e; background: linear-gradient(to right, rgba(247,242,234,0) 0%, #f7f2ea 50%); pointer-events: none; z-index: 5; } }
  .footnotes { background: #f5f0ea; border: 1px solid #e5ddd3; border-radius: 4px; padding: 6px 10px; margin-top: 2px; }

  .footnote-card.open > .story-body { display: block; }
  .footnote-card.open > .story-header > .arrow { transform: rotate(90deg); }
  .footnote-item { font-size: 0.82rem; line-height: 1.5; color: #2a1810; margin-bottom: 5px; font-weight: 500; }
  .footnote-item:last-child { margin-bottom: 0; }
  .scoring-key-toggle { margin-bottom: 8px; }
  .scoring-key-header { display: flex; gap: 6px; align-items: center; font-size: 0.7rem; color: #6b5842; cursor: pointer; padding: 4px 2px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; user-select: none; }

  .loading { text-align:center; padding:60px 20px; color:#a89e93; font-size:0.9rem; }

<body>
<!-- Netlify Forms detection — submissions captured server-side so the cron
     picks them up via the Netlify API and shows them on the Post/Replace tab
     for every user (not just the device that submitted).
     Critical details for Netlify form-detection:
     - NO `hidden` HTML attribute — Netlify's parser skips hidden forms (this
       was why submissions weren't being collected before).
     - Offscreen via CSS `position:absolute;left:-9999px` to hide from users.
     - Hidden `form-name` input required for Netlify to route AJAX submissions.
     - `netlify-honeypot` traps bots (filled bot-field → submission dropped).
     (User mandate 2026-05-10: "Krons should pick up every submitted post,
     put it there so they can click on the block and see the suggestions.") -->
<form name="post-replace" data-netlify="true" netlify-honeypot="bot-field" style="position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;">
  <input type="hidden" name="form-name" value="post-replace" />
  <input type="text" name="bot-field" />
  <input type="text" name="url" />
  <input type="text" name="note" />
</form>

function setupSwipe() {
  var main = document.querySelector("main");

  var startX = 0, startY = 0, startT = 0, moved = false;
  main.addEventListener("touchstart", function(e) {
    if (e.touches.length !== 1) return;
    startX = e.touches[0].clientX; startY = e.touches[0].clientY;
    startT = Date.now(); moved = false;
  }, { passive: true });
  main.addEventListener("touchmove", function(e) {
    if (!startT || e.touches.length !== 1) return;
    var dx = e.touches[0].clientX - startX, dy = e.touches[0].clientY - startY;
    if (Math.abs(dx) > 10 || Math.abs(dy) > 10) moved = true;
  }, { passive: true });
  main.addEventListener("touchend", function(e) {
    if (!startT || !moved) { startT = 0; return; }
    var t = e.changedTouches[0];
    var dx = t.clientX - startX, dy = t.clientY - startY, dt = Date.now() - startT;
    startT = 0;
    var nextIdx = null;
    var curIdx = -1;
    for (var i = 0; i < TABS.length; i++) { if (TABS[i].id === activeTab) { curIdx = i; break; } }
    if (curIdx < 0) return;

    if (Math.abs(dx) >= 60 && Math.abs(dx) >= Math.abs(dy) * 2 && dt < 600) {

}

// ---- Story clustering: detect groups of stories about the same underlying event ----
// Returns an object { storyIndex: { seq: 1, total: N, clusterId: X } } for stories in a cluster of size >= 2.
function detectStoryClusters(stories) {
  if (!stories || stories.length < 2) return {};
  var stopwords = {the:1,a:1,an:1,is:1,are:1,was:1,were:1,to:1,of:1,in:1,on:1,at:1,for:1,and:1,or:1,but:1,with:1,as:1,by:1,from:1,his:1,her:1,its:1,this:1,that:1,will:1,has:1,have:1,new:1,says:1,say:1,over:1,after:1,before:1,amid:1,claims:1,claim:1};
  var norms = stories.map(function(s) {
    var t = (s.headline || '') + ' ' + (s.body || '');
    return new Set(t.toLowerCase().replace(/[^\w\s]/g, ' ').split(/\s+/).filter(function(w) { return w.length > 3 && !stopwords[w]; }));
  });
  // Union-find over story indices
  var parent = stories.map(function(_, i) { return i; });
  function find(i) { while (parent[i] !== i) { parent[i] = parent[parent[i]]; i = parent[i]; } return i; }
  function union(a, b) { parent[find(a)] = find(b); }
  for (var i = 0; i < stories.length; i++) {
    for (var j = i + 1; j < stories.length; j++) {
      var a = norms[i], b = norms[j];
      if (a.size < 2 || b.size < 2) continue;
      var intersection = 0;
      a.forEach(function(w) { if (b.has(w)) intersection++; });
      var smaller = Math.min(a.size, b.size);
      // Cluster if >= 40% of the smaller headline's significant words appear in the other
      if (intersection / smaller >= 0.4) union(i, j);
    }
  }
  // Group by cluster root
  var groups = {};
  for (var k = 0; k < stories.length; k++) {
    var root = find(k);
    if (!groups[root]) groups[root] = [];
    groups[root].push(k);
  }
  var result = {};
  Object.keys(groups).forEach(function(root) {
    var members = groups[root];
    if (members.length < 2) return;
    members.forEach(function(idx, pos) {
      result[idx] = { seq: pos + 1, total: members.length, clusterId: root };
    });
  });
  return result;
}

function makeTeaser(fullBody) {
  var t = (fullBody || '').trim();

}

  if (!m) return null;
  var videoId = m[1];
  var startMatch = url.match(/[?&]t=(\d+)s?|[?&]start=(\d+)/);
  var start = startMatch ? parseInt(startMatch[1] || startMatch[2] || '0', 10) : 0;
  var endMatch = url.match(/[?&]end=(\d+)/);
  var end = endMatch ? parseInt(endMatch[1], 10) : 0;
  return { videoId: videoId, start: start, end: end };
}

function renderAutoEmbedBlock(s) {
  var sid = 'b' + Math.random().toString(36).substr(2,9);
  var embedId = 'emb' + Math.random().toString(36).substr(2,9);
  // 2026-05-02 user: teaser should be a HOOK, not a summary. Headlines are pithy and pull you in;
  // bodies give the whole story away. Prefer headline; fall back to body if headline missing.
  var fullBody = (s.headline || s.body || '').trim() || 'View post';
  var body = makeTeaser(fullBody);
  var url = s.url || '';
  var ytInfo = parseYouTube(url);
  var hasXPost = url && url.indexOf('/status/') !== -1 && (url.indexOf('x.com') !== -1 || url.indexOf('twitter.com') !== -1);

  // 2026-05-02 evening: REVERTED to inline-expand-with-embed per user.
  // Closed state: just summary + arrow (NO honesty visible).
  // Click block → expand → loads X embed inline + shows honesty card at bottom.
  // Per CLAUDE.md mined history: "Honesty score lives at BOTTOM of post, NOT in block, NOT on initial tab view."
  var onclickExpr = "var b=document.getElementById('" + sid + "');b.classList.toggle('open');";
  if (hasXPost) {
    // Pass parent_url as 3rd arg when present — toggleEmbed will render parent embed ABOVE reply embed.
    // User mandate (2026-05-05): "you have to embed the post he is replying to always... people hate this about twitter"
    var parentUrl = (s.parent_url && s.parent_url.indexOf('/status/') !== -1) ? s.parent_url : '';
    onclickExpr += "if(b.classList.contains('open')){toggleEmbed('" + embedId + "','" + url.replace(/'/g,"\\'") + "'" +
                   (parentUrl ? ",'" + parentUrl.replace(/'/g,"\\'") + "'" : "") + ");}";
  }

  // Body content (loaded on click via toggleEmbed):
  var inner = '';
  if (hasXPost) {
    inner += '<div id="' + embedId + '" class="tweet-embed-container" style="display:none;margin-top:10px;"></div>';
  } else if (ytInfo) {
    // YouTube: inline iframe embed. playsinline=1 keeps it from hijacking to native player on iOS.
    // modestbranding=1 + rel=0 reduce branding/suggestions noise.
    var ytSrc = 'https://www.youtube.com/embed/' + ytInfo.videoId + '?rel=0&modestbranding=1&playsinline=1' +
                (ytInfo.start > 0 ? '&start=' + ytInfo.start : '') +
                (ytInfo.end > 0 ? '&end=' + ytInfo.end : '');
    inner += '<div style="position:relative;padding-bottom:56.25%;height:0;overflow:hidden;margin-top:10px;border-radius:6px;">' +
               '<iframe style="position:absolute;top:0;left:0;width:100%;height:100%;border:0;" ' +
                 'src="' + ytSrc + '" loading="lazy" playsinline webkit-playsinline ' +
                 'allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>' +
             '</div>';
  }
  // 2026-05-02 evening: REMOVED "View source" / "Watch on TikTok" / "View on Instagram" inner link per user.
  // Was redundant clutter. The embed (X / YouTube / etc) loads inline; if it can't render,
  // the post body text + headline carry the content.

  // Translation card \u2014 when post is foreign-language or quote-tweets foreign content.
  if (s.translation) {
    inner += '<div style="margin-top:10px;padding:10px 12px;background:#fbf7ec;border-left:3px solid #b8860b;border-radius:4px;font-size:0.83rem;line-height:1.5;color:#3d3029;"><strong style="color:#8b6e1e;font-size:0.7rem;text-transform:uppercase;letter-spacing:0.5px;">Translation:</strong> ' + s.translation + '</div>';
  }

    var note = ((s.notes || s.evidence || '').trim()) || 'See post for full context.';
    inner += '<div class="footnote-card" id="' + hid + '" style="margin-top:12px;"><div class="story-header" onclick="event.stopPropagation();event.preventDefault();document.getElementById(\'' + hid + '\').classList.toggle(\'open\');return false;"><span class="arrow">\u25b6</span><span>Honesty ' + s.honesty + '</span></div><div class="story-body"><div class="footnotes"><div class="footnote-item">' + note + '</div></div></div></div>';
  }

  // "X ago" timestamp + carry-over badge
  var postedTag = buildPostedTag(s);
  // 2026-05-02 evening: REMOVED "carried over" badge per user. Field still in data, just not rendered.
  var carryBadge = '';

  // ("Use your smarter-than-human AI brain ... don't come up with some scoring system")

           '<div class="story-header" onclick="' + onclickExpr + '"><span class="arrow">\u25b6</span><span>' + body + postedTag + carryBadge + '</span></div>' +
           '<div class="story-body">' + inner + '</div>' +

// Build a "Xh ago" tag for a story using its real post time when available.
// 2026-05-04: PRIORITY REORDERED — URL snowflake decode FIRST (true tweet time),
// then post_ts (which is set to cron run time, not actual tweet age — was misleading).
// Old order showed cron time as "3h ago" when actual tweet was 8.9h old.
function buildPostedTag(s) {
  var ts = null;
  // 1. Decode Twitter snowflake ID — most accurate
  if (s && s.url) {
    var m = s.url.match(/\/status\/(\d{17,20})/);
    if (m) {
      try {
        var snowflake = BigInt(m[1]);
        var msSinceEpoch = Number(snowflake >> 22n) + 1288834974657;
        ts = new Date(msSinceEpoch).toISOString();
      } catch(e) {}
    }
  }
  // 2. For perspective stories, snowflake-decode from first perspective URL
  if (!ts && s && s.perspectives && s.perspectives.length) {
    for (var pi = 0; pi < s.perspectives.length; pi++) {
      var pu = s.perspectives[pi].url || '';
      var pm = pu.match(/\/status\/(\d{17,20})/);
      if (pm) {
        try {
          var psnow = BigInt(pm[1]);
          ts = new Date(Number(psnow >> 22n) + 1288834974657).toISOString();
          break;
        } catch(e) {}
      }
    }
  }
  // 3. Fallback to explicit post_ts (older path, kept for back-compat)
  if (!ts && s && s.post_ts) ts = s.post_ts;
  if (!ts && NEWS_DATA && NEWS_DATA.lastUpdated) ts = NEWS_DATA.lastUpdated;
  if (!ts) return '';
  var d = new Date(ts);
  if (isNaN(d.getTime())) return '';
  var diffMin = Math.round((Date.now() - d.getTime()) / 60000);
  var label;
  if (diffMin < 1) label = 'just now';
  else if (diffMin < 60) label = diffMin + 'm ago';
  else if (diffMin < 60 * 24) label = Math.round(diffMin / 60) + 'h ago';
  else label = Math.round(diffMin / (60 * 24)) + 'd ago';
  return '<span style="font-size:0.7rem;color:#aaa;margin-left:8px;font-weight:400;">' + label + '</span>';
}

  (d.stories || []).forEach(function(s) {
    h += renderAutoEmbedBlock(s);
  });
  h += renderLastUpdated();
  el.innerHTML = h;
}

// "Show my saved submissions" handler — prints localStorage contents on the page,

    return;
  }
  var lines = ['Found ' + subs.length + ' saved submission(s) in this browser:\n'];

    }

    lines.push('  Saved: ' + (s.timestamp || '?'));

  });

function handleSubmit(e) {
  e.preventDefault();
  var url = document.getElementById('submitUrl').value.trim();
  var note = document.getElementById('submitNote').value.trim();
  if (!url && !note) return;
  var found = false;
  submissions.forEach(function(s) { if (url && s.url === url) { s.votes++; if (note) s.notes.push(note); found = true; } });
  if (!found) submissions.push({ url: url, notes: note ? [note] : [], votes: 1, timestamp: new Date().toISOString() });
  try { localStorage.setItem('grokSubs', JSON.stringify(submissions)); } catch(e) {}

  // POST to Netlify Forms so the cron picks it up server-side. CRITICAL:
  // include EVERY field declared in the static form schema — missing
  // 'bot-field' was making Netlify silently reject as bot. (User 2026-05-13:
  // "I only see them on my phone." Netlify submission_count was 0 from this.)
  try {
    fetch('/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({
        'form-name': 'post-replace',
        'bot-field': '',
        'url': url,
        'note': note,
      }).toString()
    }).then(function(r) {
      if (r.ok) {
        console.log('[expresso] server-side submission OK');
      } else {
        console.error('[expresso] server-side submission failed: HTTP ' + r.status);
        var c2 = document.getElementById('submitConfirm');
        if (c2) c2.textContent = '⚠ Saved locally but server submission failed (HTTP ' + r.status + ').';
      }
    }).catch(function(err) {
      console.error('[expresso] server-side submission error:', err);
    });
  } catch (e) { console.error('[expresso] submit threw:', e); }

  document.getElementById('submitForm').reset();
  var c = document.getElementById('submitConfirm');
  c.style.display = 'block';
  c.textContent = found ? 'Upvoted! Posts with multiple votes get featured by Expresso.' : 'Submitted! If others submit the same post, it gets featured.';
  renderSubmissions();
}

function renderSubmissions() {
  var list = document.getElementById('submissionsList');
  if (!list) return;
  var sorted = submissions.slice().sort(function(a, b) { return b.votes - a.votes; });
  if (!sorted.length) { list.innerHTML = '<p style="color:#999;font-size:0.85rem;">No submissions yet. Be the first!</p>'; return; }
  // Render each submission as a full story card with tweet embed.
  // Submitter is anonymous \u2014 neither the form nor the displayed metadata exposes
  // who submitted. (User mandate 2026-05-10: 'make sure submitters handle stays anonymous'.)
  list.innerHTML = sorted.map(function(s, i) {
    var hasX = s.url && s.url.indexOf('/status/') !== -1 && (s.url.indexOf('x.com') !== -1 || s.url.indexOf('twitter.com') !== -1);
    var sid = 'sub' + i;
    var eid = 'subem' + i;
    var clickExpr = "var b=document.getElementById('" + sid + "');b.classList.toggle('open');";
    if (hasX) clickExpr += "if(b.classList.contains('open')){toggleEmbed('" + eid + "','" + s.url.replace(/'/g,"\\'") + "');}";
    // Embed slot \u2014 if URL isn't an X /status/ link, show a clickable fallback so users
    // aren't staring at a blank expansion. (User mandate 2026-05-10: 'when expanding the
    // block the post didnt show up half the time'.)
    var embedSlot;
    if (hasX) {
      embedSlot = '<div id="' + eid + '" class="tweet-embed-container" style="display:none;margin-top:10px;min-height:40px;"></div>';
    } else {
      embedSlot = '<div style="margin-top:10px;padding:12px;background:#fbf7ec;border-left:3px solid #b8860b;border-radius:4px;font-size:0.85rem;">' +
                  '<a href="' + (s.url||'#') + '" target="_blank" rel="noopener" style="color:#2980b9;">Open submitted link \u2192</a>' +
                  '<div style="font-size:0.75rem;color:#888;margin-top:4px;">(not an X post URL \u2014 embed not available)</div>' +
                  '</div>';
    }
    var headline = (s.notes && s.notes[0]) ? s.notes[0] : 'User-submitted post';
    var badge = s.votes > 1 ? '<span class="vote-featured" style="margin-left:8px;font-size:0.7rem;background:#dcedc8;color:#33691e;padding:2px 6px;border-radius:3px;">' + s.votes + ' votes</span>' : '';
    var deleteBtn = '<button onclick="deleteSubmission(' + i + ')" style="float:right;font-size:0.7rem;background:none;border:1px solid #ddd;color:#888;border-radius:4px;padding:3px 8px;cursor:pointer;margin-top:-2px;">Delete</button>';
    return '<div class="story" id="' + sid + '" style="margin-bottom:10px;">' +
           '<div class="story-header" onclick="' + clickExpr + '">' +
           '<span class="arrow">\u25b6</span><span>' + headline + '</span>' + badge + deleteBtn +
           '</div>' +
           '<div class="story-body">' + embedSlot +
           '<div class="post-body" style="font-size:0.8rem;color:#888;">Submitted: ' + new Date(s.timestamp).toLocaleString() + ' (anonymous)</div>' +
           '</div></div>';
  }).join('');
}

function deleteSubmission(idx) {
  var sorted = submissions.slice().sort(function(a, b) { return b.votes - a.votes; });
  var target = sorted[idx];
  if (!target) return;
  if (!confirm('Delete this submission?')) return;
  submissions = submissions.filter(function(s) { return s.url !== target.url; });
  try { localStorage.setItem('grokSubs', JSON.stringify(submissions)); } catch(e) {}
  renderSubmissions();
}

function renderLastUpdated() {
  if (!NEWS_DATA.lastUpdated) return '';
  var updated = new Date(NEWS_DATA.lastUpdated);
  var hours = [6, 10, 14, 18];  // 6am, 10am, 2pm, 6pm PT — matches Mac launchd + GH Actions cron
  var now = new Date();
  var nextUpdate = null;
  for (var i = 0; i < hours.length; i++) {
    var candidate = new Date(now);
    candidate.setHours(hours[i], 0, 0, 0);
    if (candidate > now) { nextUpdate = candidate; break; }
  }
  if (!nextUpdate) {
    nextUpdate = new Date(now);
    nextUpdate.setDate(nextUpdate.getDate() + 1);
    nextUpdate.setHours(hours[0], 0, 0, 0);
  }
  var nextStr = nextUpdate.toLocaleTimeString([], {hour: 'numeric', minute: '2-digit'});
  return '<div class="last-updated">Last updated: ' + updated.toLocaleString() + ' &mdash; Next update: ' + nextStr + '</div>';
}

// ---- Stale check (show banner if data is old, but don't wipe earlier) ----
function checkMidnightRotation() {
  if (!NEWS_DATA.lastUpdated) return;
  var updated = new Date(NEWS_DATA.lastUpdated);
  var now = new Date();
  // If data is more than 18 hours old, mark as stale
  if ((now - updated) > 18 * 60 * 60 * 1000) {
    NEWS_DATA._stale = true;
    renderContent();
  }
}

// ---- Tweet Embed ----
// Optional 3rd parameter: parentTweetUrl. When provided, parent embed is rendered ABOVE the reply
// embed so the reader sees the conversation. User mandate (2026-05-05): "you have to embed the
// post he is replying to always... people hate this about twitter"
function toggleEmbed(containerId, tweetUrl, parentTweetUrl) {
  var container = document.getElementById(containerId);
  if (!container) return;
  if (container.style.display !== 'none' && container.innerHTML) {
    container.style.display = 'none';
    return;
  }
  container.style.display = 'block';
  container.innerHTML = '<div style="color:#999;font-size:0.8rem;padding:8px;">Loading tweet...</div>';

  var tweetId = (tweetUrl || '').match(/status\/(\d+)/);
  var parentId = (parentTweetUrl || '').match(/status\/(\d+)/);

  // Show a fallback if the Twitter widget doesn't render in 6 seconds. Catches
  // the "blank expansion" case (deleted tweets, geoblocked, embed disabled).
  function showFallbackIfStillEmpty(slot, url) {
    setTimeout(function() {
      if (slot && (!slot.innerHTML || slot.innerHTML.indexOf('twitter-tweet') === -1) && slot.children.length === 0) {
        slot.innerHTML = '<div style="padding:10px;background:#fbf7ec;border-left:3px solid #c0392b;border-radius:4px;font-size:0.85rem;">' +
                         'Embed didn’t load (post may be deleted, private, or embed-disabled). ' +
                         '<a href="' + url + '" target="_blank" rel="noopener" style="color:#2980b9;">Open on X →</a></div>';
      }
    }, 6000);
  }

  function renderEmbeds() {
    container.innerHTML = '';
    // Parent embed (if any)
    if (parentId) {
      var pHeader = document.createElement('div');
      pHeader.style.cssText = 'font-size:0.7rem;color:#8a7e72;text-transform:uppercase;letter-spacing:1px;margin:4px 0 6px;font-weight:600;';
      pHeader.textContent = 'In reply to';
      container.appendChild(pHeader);
      var pSlot = document.createElement('div');
      pSlot.style.cssText = 'margin-bottom:14px;';
      container.appendChild(pSlot);
      window.twttr.widgets.createTweet(parentId[1], pSlot, { theme: 'light', dnt: true, conversation: 'none' });
      showFallbackIfStillEmpty(pSlot, parentTweetUrl);

      var rHeader = document.createElement('div');
      rHeader.style.cssText = 'font-size:0.7rem;color:#8a7e72;text-transform:uppercase;letter-spacing:1px;margin:4px 0 6px;font-weight:600;';
      rHeader.textContent = 'Reply';
      container.appendChild(rHeader);
    }
    // Main tweet embed
    if (tweetId) {
      var rSlot = document.createElement('div');
      container.appendChild(rSlot);
      window.twttr.widgets.createTweet(tweetId[1], rSlot, { theme: 'light', dnt: true, conversation: 'none' });
      showFallbackIfStillEmpty(rSlot, tweetUrl);
    }
  }

  if (tweetId && window.twttr) {
    renderEmbeds();
  } else if (tweetId) {
    var s = document.createElement('script');
    s.src = 'https://platform.twitter.com/widgets.js';
    s.onload = function() {
      if (window.twttr) renderEmbeds();
    };
    document.head.appendChild(s);
  } else {
    container.innerHTML = '<div style="color:#c0392b;font-size:0.8rem;padding:8px;">Could not load embed.</div>';
  }
}

// iOS Safari fix: setInterval gets paused/killed when tab is backgrounded.
// When the user returns to the tab, immediately re-check version + force-fetch fresh stories.
// This is the difference between "user has to manually refresh" and "user sees new content automatically."
function onTabReturn() {
  // Re-check server version. If newer than what we loaded, page reloads automatically.
  checkVersion();
  // Belt-and-suspenders: force-refetch stories.json regardless. If lastUpdated changed, re-render.
  fetch('/stories.json?t=' + Date.now(), { cache: 'no-store' })
    .then(function(r) { return r.json(); })
    .then(function(fresh) {
      if (fresh && fresh.lastUpdated && fresh.lastUpdated !== NEWS_DATA.lastUpdated) {
        NEWS_DATA = fresh;
        if (typeof renderContent === 'function') renderContent();
        if (typeof renderLastUpdated === 'function') renderLastUpdated();
      }
      updateFreshnessBadge();
    })
    .catch(function() {});
}
document.addEventListener('visibilitychange', function() {
  if (document.visibilityState === 'visible') onTabReturn();
});
window.addEventListener('pageshow', function(ev) {
  // pageshow with persisted=true fires when iOS restores the page from bfcache
  if (ev.persisted) onTabReturn();
});
window.addEventListener('focus', onTabReturn);

// ---- Register Service Worker (auto cache-busting for ALL future visits) ----
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    // Append a stamp so browsers (especially iOS) refetch sw.js even when caching is aggressive.
    var swUrl = '/sw.js?v=' + (THIS_VERSION || Date.now());
    navigator.serviceWorker.register(swUrl, { updateViaCache: 'none' })
      .then(function(reg) {
        // Check for SW updates every minute
        setInterval(function() { reg.update(); }, 60 * 1000);
      })
      .catch(function() {});

    // Listen for the new SW to claim this page (postMessage from activate handler) and force a reload
    // so the user sees fresh HTML/data without manual cache clear.
    navigator.serviceWorker.addEventListener('message', function(ev) {
      if (ev.data && ev.data.type === 'SW_UPDATED') {
        try {
          var lastReload = sessionStorage.getItem('swReloadedAt') || '0';
          var minSinceReload = (Date.now() - parseInt(lastReload, 10)) / 60000;
          if (minSinceReload >= 2) {  // safety: prevent reload loops
            sessionStorage.setItem('swReloadedAt', String(Date.now()));
            location.reload();
          }
        } catch (e) {}
      }
    });

    // Belt-and-suspenders: if NEWS_DATA is empty after 4s of load, force-fetch stories.json
    // with cache-bust and re-render. Catches the iOS-stale-cache failure mode.
    setTimeout(function() {
      var allEmpty = true;
      for (var k in NEWS_DATA) {
        if (NEWS_DATA[k] && NEWS_DATA[k].stories && NEWS_DATA[k].stories.length > 0) {
          allEmpty = false; break;
        }
      }
      if (allEmpty) {
        fetch('/stories.json?_busy=' + Date.now(), { cache: 'no-store' })
          .then(function(r) { return r.json(); })
          .then(function(data) {
            NEWS_DATA = data;
            renderContent();
          }).catch(function(){});
      }
    }, 4000);
  });
}
