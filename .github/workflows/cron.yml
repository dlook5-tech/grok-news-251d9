name: eXpressO News Cron

on:
  schedule:
    # 4 crons/day. Times shifted to :17 minutes past the hour because GitHub Actions
    # scheduled workflows are heavily delayed at top-of-hour (high-load window).
    # Mid-hour fires get scheduled within ~5 min instead of 30+ min.
    # PDT (UTC-7, summer): 13:17, 17:17, 21:17, 01:17 UTC = ~6:17am, 10:17am, 2:17pm, 6:17pm PT
    - cron: '17 1,13,17,21 * * *'
  workflow_dispatch:  # Manual trigger from the Actions tab

# Prevent overlap if a previous run is still going
concurrency:
  group: expresso-cron
  cancel-in-progress: false

permissions:
  contents: write   # required so the "Commit refreshed state files" step can push back

jobs:
  cron:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        # Only use stdlib + what's already in update.sh — but ensure jq isn't relied on.
        # No PyPI deps needed: parse_grok.py uses only stdlib.
        run: |
          python3 --version
          which curl
          which python3

      - name: Run pipeline
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # On CI, the user-global Mac settings.json doesn't exist — skip the audit's
          # hard-fail behavior so the pipeline runs. Audit still logs PASS/FAIL.
          RULE_AUDIT_SOFT: '1'
        run: |
          chmod +x update.sh deploy.sh verify_rules.sh 2>/dev/null || true
          bash update.sh

      - name: Commit refreshed state files
        # update.sh modifies version.txt + sw.js + stories.json + index.html (BUILD stamps).
        # Push them back so the next cron starts from current state.
        # Pull-rebase before push handles the race where commits land on main during
        # the pipeline run (e.g. dev pushing fixes). State files are auto-generated, so
        # if there's a conflict we always prefer "ours" (the cron's fresh state).
        if: success()
        run: |
          git config user.name "expresso-cron"
          git config user.email "cron@expresso-news.local"
          git add -A version.txt sw.js stories.json index.html seen_history.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Cron: refresh stories $(date -u +%Y-%m-%dT%H:%MZ)"
            # Try push, on rejection rebase + retry
            for i in 1 2 3; do
              if git push 2>&1; then
                echo "Push succeeded on attempt $i"
                exit 0
              fi
              echo "Push rejected (remote drift). Rebasing..."
              git fetch origin main
              git rebase -X ours origin/main || { git rebase --abort; exit 1; }
            done
            echo "ERROR: push failed after 3 attempts"
            exit 1
          else
            echo "No changes to commit"
          fi

      - name: Upload pipeline log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-log-${{ github.run_id }}
          path: |
            /tmp/expresso_qc_review.log
            /tmp/grok_raw*.json
          retention-days: 7
